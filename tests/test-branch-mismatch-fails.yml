name: Test branch pattern that does not match rejects release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake gh CLI (records calls instead of touching GitHub)
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/gh-calls.log
          cat > /tmp/fakebin/gh <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/gh-calls.log
          exit 0
          EOF
          chmod +x /tmp/fakebin/gh
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v1.0.0
          branch: no-such-branch-xyz-12345
      - name: Assert action failed without calling gh
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          if [ -f /tmp/gh-calls.log ]; then cat /tmp/gh-calls.log; echo "FAIL: gh should not be called"; exit 1; fi
          echo "PASS"
