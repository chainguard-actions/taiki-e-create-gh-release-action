name: Test branch mismatch error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with branch pattern that won't match (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v1.0.0
          token: dummy-token-for-test
          branch: '^this-branch-does-not-exist$'
      - name: Assert action failed due to branch mismatch
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when branch pattern does not match"
            exit 1
          fi
          echo "PASS: action correctly failed when branch pattern did not match"
