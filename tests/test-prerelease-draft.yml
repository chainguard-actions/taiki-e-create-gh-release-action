name: Test prerelease tag with draft
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake gh CLI (records calls instead of touching GitHub)
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/gh-calls.log /tmp/gh-create-args
          cat > /tmp/fakebin/gh <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/gh-calls.log
          if [ "$1" = "release" ] && [ "$2" = "view" ]; then exit 1; fi
          if [ "$1" = "release" ] && [ "$2" = "create" ]; then
            printf '%s\n' "$@" > /tmp/gh-create-args
            exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fakebin/gh
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          ref: refs/tags/v2.0.0-beta.1
          draft: 'true'
          title: 'Release $version'
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
          PREFIX: ${{ steps.action.outputs.computed-prefix }}
        run: |
          echo "version: $VERSION"
          echo "computed-prefix: $PREFIX"
          if [ "$VERSION" != "2.0.0-beta.1" ]; then echo "FAIL: expected version 2.0.0-beta.1"; exit 1; fi
          if [ "$PREFIX" != "v" ]; then echo "FAIL: expected computed-prefix 'v'"; exit 1; fi
          echo "PASS"
      - name: Assert gh release create arguments
        run: |
          cat /tmp/gh-create-args
          if ! grep -qx -- '--prerelease' /tmp/gh-create-args; then echo "FAIL: missing --prerelease"; exit 1; fi
          if ! grep -qx -- '--draft' /tmp/gh-create-args; then echo "FAIL: missing --draft"; exit 1; fi
          TITLE=$(grep -x -A1 -- '--title' /tmp/gh-create-args | tail -n1)
          if [ "$TITLE" != "Release 2.0.0-beta.1" ]; then echo "FAIL: expected title 'Release 2.0.0-beta.1', got '$TITLE'"; exit 1; fi
          echo "PASS"
