name: Test branch restriction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up git and local origin reachable by the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          TIMESTAMP="$(date +%s)"
          TEST_TAG="v0.0.4-test-${TIMESTAMP}"
          echo "TEST_TAG=${TEST_TAG}" >> "$GITHUB_ENV"
          git tag "${TEST_TAG}"
          # Set up a local bare repo as origin so git fetch works under act
          # The commit is on 'act-harness' branch, which does NOT match 'main|master'
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - name: Run action with non-matching branch restriction (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/${{ env.TEST_TAG }}
          branch: 'main|master'
          token: ${{ github.token }}
      - name: Assert action failed due to branch restriction
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to branch restriction, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly rejected release from non-matching branch"
