name: Test invalid tag format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid tag format (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          ref: refs/tags/not-a-semver-tag
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid tag format"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid tag format"
