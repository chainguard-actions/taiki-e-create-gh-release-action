name: Test invalid tag format error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/not-a-semver-tag
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/not-a-semver-tag
          token: fake-token-for-testing
      - name: Assert action failed due to invalid tag format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tag format is not semver"
            exit 1
          fi
          echo "PASS: action correctly failed when tag format was invalid"
