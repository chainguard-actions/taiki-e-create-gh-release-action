name: Test invalid tag format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid tag format (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/not-a-semver-tag
          token: ${{ github.token }}
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid tag format, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid tag format"
