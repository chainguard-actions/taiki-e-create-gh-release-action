name: Test changelog input with allow-missing-changelog (expect failure at release creation)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with changelog input and fake token (expect failure at gh release create)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          ref: refs/tags/v1.0.0
          changelog: ${{ github.workspace }}/actions/hardened/taiki-e--create-gh-release-action/v1.10.0/CHANGELOG.md
          allow-missing-changelog: 'true'
      - name: Assert action failed (expected - fake token cannot create release)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake token"
            exit 1
          fi
          echo "PASS: action correctly failed (changelog input was exercised, release creation failed as expected with fake token)"
