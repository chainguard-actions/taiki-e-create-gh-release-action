name: Test changelog input with allow-missing-changelog
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v1.0.0
          token: fake-token-for-testing
          changelog: CHANGELOG.md
          allow-missing-changelog: 'true'
      - name: Assert action failed (expected due to fake token after changelog processing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (fake token prevents release creation)"
            exit 1
          fi
          echo "PASS: action correctly failed after processing changelog input"
