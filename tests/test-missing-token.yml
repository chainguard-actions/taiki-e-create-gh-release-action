name: Test missing token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v1.0.0
          # Intentionally omit token and GITHUB_TOKEN to trigger error
      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no token is provided, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no token was provided"
