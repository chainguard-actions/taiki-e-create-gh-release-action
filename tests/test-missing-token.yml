name: Test missing token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/tags/v1.0.0
          GITHUB_TOKEN: ''
        with:
          ref: refs/tags/v1.0.0
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no token is provided"
            exit 1
          fi
          echo "PASS: action correctly failed when no token was provided"
