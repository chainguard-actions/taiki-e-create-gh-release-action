name: Test invalid ref error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with branch ref instead of tag ref (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/heads/main
          token: fake-token-for-validation-test
      - name: Assert action failed due to invalid ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ref is not a tag ref, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when ref was not a tag ref"
