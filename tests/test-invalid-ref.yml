name: Test invalid tag ref rejection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gh CLI
        run: |
          mkdir -p /tmp/mock-bin
          printf '#!/bin/sh\necho "mock-gh called with: $*" >&2\ncase "$1 $2" in\n  "release view")\n    exit 1\n    ;;\n  "release create")\n    echo "https://github.com/test/repo/releases/tag/test"\n    exit 0\n    ;;\n  "release delete")\n    exit 0\n    ;;\n  *)\n    exit 0\n    ;;\nesac\n' > /tmp/mock-bin/gh
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          title: 'Test Release $tag'
          draft: 'true'
          allow-missing-changelog: 'false'
          ref: refs/heads/main
        continue-on-error: true

      - name: Assert action failed for non-tag ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-tag ref, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected non-tag ref"
