name: Test invalid ref (non-tag ref)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with non-tag ref (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/heads/main
          token: ${{ github.token }}
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ref is not a tag ref, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for non-tag ref"
