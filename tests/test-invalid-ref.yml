name: Test invalid ref (non-tag)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with non-tag ref (expect failure)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REF: refs/heads/main
        with:
          token: fake-token-for-testing
          ref: refs/heads/main
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when ref is not a tag"
            exit 1
          fi
          echo "PASS: action correctly failed for non-tag ref"
