name: Test invalid allow-missing-changelog value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          ref: refs/tags/v1.2.3
          allow-missing-changelog: yes
      - name: Assert action failed due to invalid allow-missing-changelog value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when allow-missing-changelog is not 'true' or 'false'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid allow-missing-changelog value"
