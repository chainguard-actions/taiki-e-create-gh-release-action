name: Test invalid allow-missing-changelog value error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid allow-missing-changelog value (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v1.0.0
          token: fake-token-for-validation-test
          allow-missing-changelog: yes
      - name: Assert action failed due to invalid allow-missing-changelog value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when allow-missing-changelog='yes', but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when allow-missing-changelog value was invalid"
