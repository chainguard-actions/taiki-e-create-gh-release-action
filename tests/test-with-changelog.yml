name: Test changelog input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with changelog input (expect failure at release creation due to fake token)
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v1.0.0
          token: fake-token-for-validation-test
          changelog: ${{ github.workspace }}/actions/hardened/taiki-e--create-gh-release-action/v1.9.2/tests/fixtures/CHANGELOG.md
          allow-missing-changelog: 'true'
      - name: Assert action ran (changelog input was accepted and processed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at gh release create (fake token), not at changelog parsing.
          # Either failure or success means the changelog input was accepted.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with changelog input (failed at release creation as expected with fake token)"
          else
            echo "PASS: action ran with changelog input"
          fi
