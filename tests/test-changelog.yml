name: Test release notes from changelog
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake gh CLI (records calls instead of touching GitHub)
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/gh-calls.log /tmp/gh-create-args
          cat > /tmp/fakebin/gh <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/gh-calls.log
          if [ "$1" = "release" ] && [ "$2" = "view" ]; then exit 1; fi
          if [ "$1" = "release" ] && [ "$2" = "create" ]; then
            printf '%s\n' "$@" > /tmp/gh-create-args
            exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fakebin/gh
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          ref: refs/tags/v1.2.3
          changelog: tests/fixtures/CHANGELOG.md
      - name: Assert outputs
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ "$VERSION" != "1.2.3" ]; then echo "FAIL: expected version 1.2.3"; exit 1; fi
          echo "PASS"
      - name: Assert notes come from the changelog entry
        run: |
          cat /tmp/gh-create-args
          if ! grep -q 'Added the frobnicator feature.' /tmp/gh-create-args; then
            echo "FAIL: notes missing changelog entry for 1.2.3"; exit 1
          fi
          if grep -q 'Initial release.' /tmp/gh-create-args; then
            echo "FAIL: notes contain entry from another version"; exit 1
          fi
          echo "PASS"
