name: Test prefix that does not match tag (invalid tag format)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with prefix that makes tag invalid (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          ref: refs/tags/v1.0.0
          # prefix 'my-crate' does not match tag 'v1.0.0', so after stripping
          # the prefix the remaining string is still 'v1.0.0' but the regex
          # requires the prefix to appear at the start of the tag.
          # Actually the tag regex requires ^${prefix}-?v?semver, so with
          # prefix='my-crate' the tag 'v1.0.0' won't match and will fail.
          prefix: my-crate
      - name: Assert action failed for non-matching prefix
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when prefix does not match tag"
            exit 1
          fi
          echo "PASS: action correctly failed when prefix does not match tag"
