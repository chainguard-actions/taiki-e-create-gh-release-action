name: Test branch input - commit not in matching branch (expect failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with branch pattern that does not match (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          ref: refs/tags/v1.0.0
          branch: nonexistent-branch-xyz-pattern
      - name: Assert action failed due to branch mismatch
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when commit is not in a matching branch"
            exit 1
          fi
          echo "PASS: action correctly failed when branch pattern does not match"
