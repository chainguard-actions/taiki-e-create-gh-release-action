name: Test branch pattern not matched error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with branch pattern that won't match (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v1.0.0
          token: fake-token-for-validation-test
          branch: this-branch-does-not-exist
      - name: Assert action failed due to branch not matching
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when branch pattern does not match, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when branch pattern did not match"
