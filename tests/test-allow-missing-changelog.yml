name: Test allow-missing-changelog
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake gh CLI (records calls instead of touching GitHub)
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/gh-calls.log /tmp/gh-create-args
          cat > /tmp/fakebin/gh <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/gh-calls.log
          if [ "$1" = "release" ] && [ "$2" = "view" ]; then exit 1; fi
          if [ "$1" = "release" ] && [ "$2" = "create" ]; then
            printf '%s\n' "$@" > /tmp/gh-create-args
            exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fakebin/gh
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          ref: refs/tags/v9.9.9
          changelog: tests/fixtures/CHANGELOG.md
          allow-missing-changelog: 'true'
      - name: Assert release created with empty notes
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          cat /tmp/gh-create-args
          if [ "$VERSION" != "9.9.9" ]; then echo "FAIL: expected version 9.9.9"; exit 1; fi
          mapfile -t ARGS < /tmp/gh-create-args
          if [ "${ARGS[2]}" != "v9.9.9" ]; then echo "FAIL: expected tag v9.9.9"; exit 1; fi
          NOTES=$(grep -x -A1 -- '--notes' /tmp/gh-create-args | tail -n +2)
          echo "notes: '$NOTES'"
          if [ -n "$NOTES" ]; then echo "FAIL: expected empty notes"; exit 1; fi
          echo "PASS"
