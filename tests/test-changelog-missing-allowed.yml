name: Test changelog input with allow-missing-changelog
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with changelog path and allow-missing-changelog (expect failure on API call)
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v1.0.0
          token: dummy-token-for-test
          changelog: CHANGELOG.md
          allow-missing-changelog: 'true'
      - name: Assert action failed (dummy token causes API failure, not changelog error)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (dummy token should cause API failure)"
            exit 1
          fi
          echo "PASS: action correctly failed (changelog input was accepted, API call failed as expected with dummy token)"
