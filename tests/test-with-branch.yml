name: Test with branch input (non-matching branch pattern)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          ref: refs/tags/v1.0.0
          branch: this-branch-does-not-exist-anywhere
      - name: Assert action failed due to branch mismatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when commit is not in a matching branch"
            exit 1
          fi
          echo "PASS: action correctly failed for non-matching branch pattern"
