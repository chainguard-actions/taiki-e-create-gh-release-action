name: Test missing changelog entry fails without allow-missing-changelog
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up mocks (gh, curl, sha256sum, parse-changelog)
        run: |
          mkdir -p "$HOME/.local/bin"

          # Copy fake scripts from fixtures
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-gh.sh" "$HOME/.local/bin/gh"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-curl.sh" "$HOME/.local/bin/curl"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-sha256sum.sh" "$HOME/.local/bin/sha256sum"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-sha256sum.sh" "$HOME/.local/bin/shasum"
          chmod +x "$HOME/.local/bin/gh" "$HOME/.local/bin/curl" "$HOME/.local/bin/sha256sum" "$HOME/.local/bin/shasum"

          # Create fake parse-changelog tarball (used by fake curl)
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-parse-changelog.sh" /tmp/parse-changelog
          chmod +x /tmp/parse-changelog
          tar czf /tmp/fake-parse-changelog.tar.gz -C /tmp parse-changelog

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run action with missing changelog entry (allow-missing-changelog=false)
        id: action-strict
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v0.2.0
          changelog: ${{ github.workspace }}/tests/fixtures/test-changelog.md
          allow-missing-changelog: 'false'
          draft: 'true'
          token: ${{ github.token }}
      - name: Assert action failed due to missing changelog entry
        env:
          OUTCOME: ${{ steps.action-strict.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when changelog entry is missing and allow-missing-changelog=false, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for missing changelog entry"
