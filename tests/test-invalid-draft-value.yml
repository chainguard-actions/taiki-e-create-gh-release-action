name: Test invalid draft value error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid draft value (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v1.0.0
          token: dummy-token-for-test
          draft: maybe
      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when draft has invalid value"
            exit 1
          fi
          echo "PASS: action correctly failed when draft value is invalid"
