name: Test invalid draft input value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid draft value (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          ref: refs/tags/v1.0.0
          draft: maybe
      - name: Assert action failed due to invalid draft value
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when draft is not 'true' or 'false'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid draft value"
