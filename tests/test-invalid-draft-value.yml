name: Test invalid draft value error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v1.0.0
          token: fake-token-for-testing
          draft: maybe
      - name: Assert action failed due to invalid draft value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when draft is not 'true' or 'false'"
            exit 1
          fi
          echo "PASS: action correctly failed when draft value was invalid"
