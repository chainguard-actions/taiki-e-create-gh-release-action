name: Test missing changelog entry fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake gh CLI (records calls instead of touching GitHub)
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/gh-calls.log /tmp/gh-create-args
          cat > /tmp/fakebin/gh <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/gh-calls.log
          if [ "$1" = "release" ] && [ "$2" = "view" ]; then exit 1; fi
          if [ "$1" = "release" ] && [ "$2" = "create" ]; then
            printf '%s\n' "$@" > /tmp/gh-create-args
            exit 0
          fi
          exit 0
          EOF
          chmod +x /tmp/fakebin/gh
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/tags/v9.9.9
          changelog: tests/fixtures/CHANGELOG.md
      - name: Assert action failed and no release was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          if [ -f /tmp/gh-create-args ]; then echo "FAIL: release should not have been created"; exit 1; fi
          echo "PASS"
